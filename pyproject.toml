[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefguard-research"
version = "0.1.0"
description = "Reproducible CPU reference study of transient visual brief violations"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "Pillow==12.3.0"]

[project.scripts]
briefguard = "briefguard.__main__:main"

[tool.setuptools.packages.find]
include = ["briefguard*"]
